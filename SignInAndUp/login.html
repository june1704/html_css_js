<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="root">
        <div class="main-layout">
            <main class="container">
                <div class="main-header">
                    <header class="login">Login</header>
                </div>
                <div class="main-item">
                    <div class="main-item-box1">
                        <div class="input-box">
                            <input class="username-input" type="text" id="username" placeholder="">
                            <label for="username">Username</label>
                        </div>
                    </div>
                    <div class="main-item-box1">
                        <div class="input-box">
                            <input class="password-input" type="password" id="password" placeholder="">
                            <label for="password">Password</label>
                        </div>
                    </div>
                    <div class="main-item-box2">
                        <button class="botton-blue">Login</button>
                    </div>
                    <div class="sign-up">
                        <p>Don't have an account?
                            <a href="./login2.html">Sign up</a>
                        </p>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="./js/login2.js"></script>
</body>
</html>
